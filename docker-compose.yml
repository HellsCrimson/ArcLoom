services:
  arcloom:
    image: ghcr.io/hellscrimson/arcloom:latest
    ports:
      - "8080:8080"
    environment:
      ARCLOOM_ENGINE: tofu
      # The master key. It seals every project's secrets, the SSO client secret,
      # per-project git tokens, the Vault token and notification URLs — so it is
      # required here rather than defaulted: compose refuses to start without it,
      # and the server refuses to boot on a short or publicly-known value.
      # Put it in a .env file next to this one (see .env.example).
      ARCLOOM_SECRET_KEY: ${ARCLOOM_SECRET_KEY:?generate one with `openssl rand -base64 32` and put it in .env}
      # Auth is on by default and fails closed. This seeds the first admin on the
      # first run only (ignored once a user exists), then log in as "admin".
      # ARCLOOM_AUTH: false to disable auth entirely.
      ARCLOOM_ADMIN_PASSWORD: ${ARCLOOM_ADMIN_PASSWORD:?choose a first-admin password and put it in .env}
      # Allow login over plain HTTP for local dev (no TLS in front). Set this to
      # "true" — the default — as soon as there is TLS in front, or the session
      # cookie travels in the clear.
      ARCLOOM_COOKIE_SECURE: "false"
      # ARCLOOM_OIDC_ISSUER: https://oidc.example.com
      # ARCLOOM_OIDC_CLIENT_ID: your-client-id
      # ARCLOOM_OIDC_CLIENT_SECRET: your-client-secret
      # ARCLOOM_OIDC_REDIRECT_URL: http://localhost:8080/api/auth/sso/oidc/callback
    volumes:
      - arcloom-cache:/var/lib/arcloom
    healthcheck:
      # Public, dependency-free liveness probe (curl ships in the runtime image).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  arcloom-cache:
