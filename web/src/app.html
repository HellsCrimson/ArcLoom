<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
		  Icons live in the SHELL, not in <svelte:head>: this app is client-side
		  rendered, so a head link added by the layout only lands after hydration,
		  while the browser asks for the tab icon on the first byte. The .svg (added
		  by +layout, hashed by Vite) wins wherever it is supported; these are the
		  fallbacks. All of them come from brand/ — see brand/README.md.
		-->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#0d1117" />
		<!--
		  The theme FOUC guard. Render-blocking and in <head>, so it still runs
		  before the first paint — but in static/theme.js rather than inline, so
		  the page can carry a script-src CSP without 'unsafe-inline'. SvelteKit
		  hashes the bootstrap it generates itself; a script written by hand here
		  it cannot see, and one un-hashed inline script would force the whole
		  policy open.
		-->
		<script src="/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
